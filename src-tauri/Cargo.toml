[package]
name = "the_best_marketplace_premium"
version = "1.0.0"
description = "THE BEST MARKETPLACE PREMIUM para Windows"
authors = ["THE BEST DIGITAL"]
edition = "2021"

[lib]
name = "the_best_marketplace_premium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
